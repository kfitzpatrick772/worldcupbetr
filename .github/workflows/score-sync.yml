name: Score sync

# Drives the live-score ingest: calls the app's /api/cron/sync endpoint, which
# pulls fixtures from API-Football and settles points (DEPLOY.md §6). This is
# the "any scheduler" option — use it if no Railway cron is configured.
#
# Each run also doubles as a production diagnostic: it checks app health and
# probes the cron endpoint's auth config, so the job log always says exactly
# which link in the ingest chain is broken (see step output).
#
# Setup (one-time):
#   1. Repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: CRON_SECRET   Value: same as the CRON_SECRET env var on Railway.
#   2. Merge this file to main (scheduled workflows only run from the default
#      branch).
#   3. On Railway, make sure SCORE_PROVIDER=apifootball and APIFOOTBALL_KEY are
#      set — otherwise the sync is a deliberate no-op and this job fails loudly.
#
# Cadence: every 15 minutes = ~96 API-Football calls/day, which fits the free
# tier (100/day). On a paid plan, tighten to */5 for snappier live scores.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  # Also run when this file itself changes on main — gives an immediate
  # smoke-run on rollout without waiting for the next schedule tick.
  push:
    branches: [main]
    paths: [".github/workflows/score-sync.yml"]

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APP_URL: ${{ vars.APP_URL || 'https://friendlybet.up.railway.app' }}
    steps:
      - name: Skip outside the tournament window
        id: window
        run: |
          today=$(date -u +%F)
          if [[ "$today" < "2026-06-11" || "$today" > "2026-07-20" ]]; then
            echo "Outside tournament window ($today) — skipping."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: App health check
        if: steps.window.outputs.active == 'true'
        run: |
          body=$(curl -sS --max-time 30 "$APP_URL/api/health") || {
            echo "::error::App unreachable at $APP_URL"; exit 1; }
          echo "Health: $body"
          echo "$body" | grep -q '"ok":true' || {
            echo "::error::App is up but unhealthy: $body"; exit 1; }

      - name: Probe cron endpoint auth config (no secret needed)
        if: steps.window.outputs.active == 'true'
        run: |
          code=$(curl -sS --max-time 30 -o /tmp/probe -w '%{http_code}' \
            "$APP_URL/api/cron/sync")
          echo "Unauthenticated probe: HTTP $code — $(cat /tmp/probe)"
          case "$code" in
            503) echo "::error::Server has NO CRON_SECRET env var on Railway — the sync endpoint is disabled. Set CRON_SECRET on the Railway service."; exit 1 ;;
            401) echo "Server CRON_SECRET is configured (endpoint correctly rejects unauthenticated calls)." ;;
            *)   echo "::warning::Unexpected status $code from the cron endpoint." ;;
          esac

      - name: Run the sync
        if: steps.window.outputs.active == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::The CRON_SECRET *repo secret* is not set (Settings → Secrets and variables → Actions). The probes above ran, but the sync itself cannot authenticate without it."
            exit 1
          fi

          body=$(curl -sS --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sync")
          echo "Response: $body"

          # Fail loudly on every non-working state so a red X = scores are NOT flowing.
          if echo "$body" | grep -q '"error"'; then
            echo "::error::Sync failed: $body"
            exit 1
          fi
          if echo "$body" | grep -q '"skipped"'; then
            echo "::error::SCORE_PROVIDER is 'manual' on the server — set SCORE_PROVIDER=apifootball and APIFOOTBALL_KEY on Railway."
            exit 1
          fi
          if ! echo "$body" | grep -q '"unmatched":\[\]'; then
            echo "::warning::Some feed fixtures did not match a seeded game — check the response above and add a name alias in src/lib/feed/match.ts."
          fi
